name: Validate package catalog

on:
  pull_request:
    paths:
      - packages.json
      - .github/workflows/validate-package-catalog.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check catalog entries
        run: |
          jq -es '
            length == 1 and (.[0] | type == "array" and all(.[];
              ([.name, .description, .repository, .readme_url] | all(.[]; type == "string"))
              and (.repository | startswith("https://github.com/expectedparrot/"))
              and (.guide_url != .readme_url)
              and ((.repository | ltrimstr("https://github.com/")) as $repo
                   | .guide_url | type == "string" and startswith("https://raw.githubusercontent.com/" + $repo + "/HEAD/") and endswith(".md"))
              and (.methods | type == "array" and all(.[]; type == "string"))
            ))
          ' packages.json > /dev/null
