name: Sync package catalog to EDSL

on:
  push:
    branches: [main]
    paths: [packages.json]
  pull_request:
    paths:
      - packages.json
      - .github/workflows/sync-edsl-catalog.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-edsl-catalog-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the directory catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Retries and manual runs should always reconcile the current main catalog.
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'refs/heads/main' }}
          path: directory
          persist-credentials: false

      - name: Check out EDSL main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: expectedparrot/edsl
          ref: main
          path: edsl
          persist-credentials: false

      - name: Validate and copy the catalog
        id: catalog
        run: |
          jq -es '
            length == 1 and (.[0] | type == "array" and all(.[];
              ([.name, .description, .repository, .readme_url] | all(.[]; type == "string"))
              and (.methods | type == "array" and all(.[]; type == "string"))
            ))
          ' directory/packages.json > /dev/null

          cp directory/packages.json edsl/edsl/skills/packages.json
          git -C edsl add -f -- edsl/skills/packages.json
          git -C edsl diff --cached --stat
          echo "revision=$(git -C directory rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or update the EDSL pull request
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.EDSL_CATALOG_SYNC_TOKEN }}
          path: edsl
          base: main
          branch: automation/sync-directory-catalog
          add-paths: edsl/skills/packages.json
          delete-branch: true
          commit-message: Refresh the EDSL research package catalog
          title: Refresh the EDSL research package catalog
          body: |
            This updates the catalog bundled with `ep skills search` to match
            [expectedparrot/directory at ${{ steps.catalog.outputs.revision }}](https://github.com/expectedparrot/directory/blob/${{ steps.catalog.outputs.revision }}/packages.json).

            Users receive the updated catalog when they install an EDSL release that includes this change.
